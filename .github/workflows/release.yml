name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25", "1.26"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10

      - name: Test
        run: go test -race -coverprofile=coverage.out -coverpkg=github.com/rdapapi/rdapapi-go ./...

      - name: Check coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 100" | bc)" -eq 1 ]; then
            echo "::error::Coverage is ${COVERAGE}%, expected 100%"
            exit 1
          fi

      - name: Build
        run: go build ./...

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Refresh pkg.go.dev
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          curl -s "https://pkg.go.dev/fetch/github.com/rdapapi/rdapapi-go@${TAG}" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
